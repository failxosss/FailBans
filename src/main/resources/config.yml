# Logs every punishment to Discord via webhook
discord:
  enabled: false
  # Create a webhook in Discord: Channel Settings -> Integrations -> Webhooks -> New Webhook -> copy URL
  webhook-url: ""
  username: "FailBan"
  avatar-url: ""
